<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>إدارة المتجر | Hoody’s Kitchen</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script defer src="admin.js"></script></head>
<body class="admin-body"><header class="admin-header"><a class="brand" href="index.html"><span class="brand-mark">H</span><span>Hoody’s Kitchen<small>OWNER DASHBOARD</small></span></a><a href="index.html" class="back-link">عرض المتجر ↗</a></header>
<main class="admin-wrap"><div class="admin-title"><span class="eyebrow">مساحة المالك</span><h1>إدارة المتجر</h1><p class="muted">إدارة الأطباق ومراجعة طلبات العملاء من مكان واحد.</p></div>
<section id="login-panel" class="panel login-panel"><h2>تسجيل دخول المالك</h2><form id="login-form" class="admin-form"><input name="email" type="email" placeholder="البريد الإلكتروني" required><input name="password" type="password" placeholder="كلمة المرور" required><button class="primary-button">دخول لوحة الإدارة</button><small id="login-message" class="form-message"></small></form></section>
<div id="dashboard" hidden>
<div class="admin-tabs"><button class="tab active" data-tab="products">الأطباق</button><button class="tab" data-tab="orders">الطلبات</button><button id="logout" class="logout">تسجيل الخروج</button></div>
<section id="products-tab" class="panel"><div class="panel-heading"><div><span class="eyebrow">القائمة</span><h2>أطباق المتجر</h2></div></div><form id="product-form" class="admin-form product-form"><input name="name" placeholder="اسم الطبق" required><select name="category" required><option value="">اختاري القسم</option><option value="desserts">الحلويات</option><option value="pastries">المعجنات</option><option value="traditional">الطبخات البلدية</option><option value="seafood">الطبخات البحرية</option></select><input name="price" type="number" min="0.01" step="0.01" placeholder="السعر بالريال" required><input name="image_url" type="url" placeholder="رابط صورة الطبق (اختياري)"><textarea name="description" placeholder="وصف مختصر للطبق"></textarea><button class="primary-button">إضافة الطبق</button><small id="product-message" class="form-message"></small></form><div id="admin-products" class="admin-list"></div></section>
<section id="orders-tab" class="panel" hidden><div class="panel-heading"><div><span class="eyebrow">طلبات العملاء</span><h2>الطلبات الواردة</h2></div><button id="refresh-orders" class="outline-button">تحديث</button></div><div id="orders-list" class="admin-list"></div></section>
</div></main></body></html>
